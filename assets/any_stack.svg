<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
  <title id="title">AI-augmented polyglot engineering</title>
  <desc id="desc">An animated card showing Codex and Claude Code with rotating Python, Rust, Go, JavaScript, TypeScript, and Solidity language marks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060816"/>
      <stop offset=".48" stop-color="#0c1330"/>
      <stop offset="1" stop-color="#101a3d"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#5eead4" stop-opacity=".72"/>
      <stop offset=".5" stop-color="#818cf8" stop-opacity=".72"/>
      <stop offset="1" stop-color="#e879f9" stop-opacity=".72"/>
    </linearGradient>
    <linearGradient id="headline" x1="76" y1="0" x2="560" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f8fafc"/>
      <stop offset=".58" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="terminal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glowA">
      <stop stop-color="#2dd4bf" stop-opacity=".2"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB">
      <stop stop-color="#a855f7" stop-opacity=".22"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="smallGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="cardClip">
      <rect x="1" y="1" width="958" height="258" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="960" height="260" fill="url(#bg)"/>
    <circle cx="110" cy="40" r="210" fill="url(#glowA)"/>
    <circle cx="875" cy="235" r="220" fill="url(#glowB)"/>
    <path d="M0 207C146 164 254 255 420 209S708 165 960 213" fill="none" stroke="#818cf8" stroke-opacity=".1" stroke-width="1.5"/>
    <path d="M0 224C157 181 274 267 438 226S718 182 960 230" fill="none" stroke="#2dd4bf" stroke-opacity=".08" stroke-width="1"/>
    <g fill="#cbd5e1" opacity=".13">
      <circle cx="47" cy="37" r="1"/>
      <circle cx="187" cy="218" r="1"/>
      <circle cx="332" cy="32" r="1"/>
      <circle cx="512" cy="223" r="1"/>
      <circle cx="608" cy="42" r="1"/>
      <circle cx="918" cy="48" r="1"/>
    </g>
  </g>

  <rect x="1" y="1" width="958" height="258" rx="24" fill="none" stroke="url(#edge)" stroke-opacity=".45" stroke-width="2"/>

  <g transform="translate(54 46)">
    <rect width="42" height="42" rx="12" fill="#111b37" stroke="#5eead4" stroke-opacity=".45"/>
    <path d="M12 14l7 7-7 7M23 28h8" fill="none" stroke="url(#terminal)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#smallGlow)"/>
    <circle cx="35" cy="8" r="2.5" fill="#a78bfa">
      <animate attributeName="opacity" values=".3;1;.3" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="110" y="59" fill="#5eead4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="2.2">AI-AUGMENTED ENGINEERING</text>
  <text x="54" y="128" fill="url(#headline)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="43" font-weight="800" letter-spacing="-1.4">CODE WITHOUT BORDERS</text>
  <text x="56" y="158" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" letter-spacing=".2">One workflow. Every stack.</text>

  <g transform="translate(54 186)">
    <rect width="132" height="34" rx="17" fill="#0f172a" stroke="#5eead4" stroke-opacity=".35"/>
    <path d="M18 10l6 7-6 7M28 24h7" fill="none" stroke="#5eead4" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="44" y="22" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.1">CODEX</text>
  </g>
  <text x="201" y="208" fill="#64748b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">×</text>
  <g transform="translate(220 186)">
    <rect width="174" height="34" rx="17" fill="#0f172a" stroke="#c084fc" stroke-opacity=".35"/>
    <path d="M20 9l2.2 5.8L28 17l-5.8 2.2L20 25l-2.2-5.8L12 17l5.8-2.2z" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="40" y="22" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1">CLAUDE CODE</text>
  </g>

  <g transform="translate(665 35)">
    <rect width="240" height="190" rx="21" fill="#080d20" fill-opacity=".78" stroke="#94a3b8" stroke-opacity=".18"/>
    <path d="M24 52H216" stroke="url(#edge)" stroke-opacity=".36"/>
    <circle cx="25" cy="24" r="3" fill="#fb7185" opacity=".75"/>
    <circle cx="37" cy="24" r="3" fill="#fbbf24" opacity=".75"/>
    <circle cx="49" cy="24" r="3" fill="#34d399" opacity=".75"/>
    <text x="72" y="28" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="700" letter-spacing="1.4">ACTIVE STACK</text>

    <g opacity="1">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.14;.17;.97;1" dur="12s" repeatCount="indefinite"/>
      <g transform="translate(24 72)">
        <path d="M42 3C30 3 30.7 8.2 30.7 8.2v5.4h11.5v1.6H26.1S18 14.3 18 27.1s7.1 12.3 7.1 12.3h4.2v-5.9s-.2-7.1 7-7.1h11.4s6.5.1 6.5-6.3V9.7S55.2 3 42 3zm-6.3 5.2a2.1 2.1 0 110 4.2 2.1 2.1 0 010-4.2z" fill="#60a5fa"/>
        <path d="M42.3 51c12 0 11.3-5.2 11.3-5.2v-5.4H42.1v-1.6h16.1s8.1.9 8.1-11.9-7.1-12.3-7.1-12.3H55v5.9s.2 7.1-7 7.1H36.6s-6.5-.1-6.5 6.3v10.4S29.1 51 42.3 51zm6.3-5.2a2.1 2.1 0 110-4.2 2.1 2.1 0 010 4.2z" fill="#facc15"/>
        <text x="83" y="29" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="750">Python</text>
        <text x="83" y="48" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" letter-spacing="1.1">AUTOMATION · AI</text>
      </g>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.14;.17;.97;1" begin="-10s" dur="12s" repeatCount="indefinite"/>
      <g transform="translate(24 72)">
        <circle cx="42" cy="27" r="23" fill="#f97316" fill-opacity=".12" stroke="#fb923c" stroke-width="2"/>
        <path d="M42 0v7M42 47v7M15 27H8M76 27h-7M23 8l5 6M61 8l-5 6M23 46l5-6M61 46l-5-6" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
        <text x="42" y="35" text-anchor="middle" fill="#fed7aa" font-family="Georgia, serif" font-size="25" font-weight="700">R</text>
        <text x="83" y="29" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="750">Rust</text>
        <text x="83" y="48" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" letter-spacing="1.1">SYSTEMS · SAFETY</text>
      </g>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.14;.17;.97;1" begin="-8s" dur="12s" repeatCount="indefinite"/>
      <g transform="translate(21 72)">
        <path d="M6 16h14M2 25h18M8 34h12" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" opacity=".7"/>
        <text x="26" y="38" fill="#22d3ee" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="850" letter-spacing="-3">GO</text>
        <text x="86" y="29" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="750">Go</text>
        <text x="86" y="48" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" letter-spacing="1.1">CLOUD · SERVICES</text>
      </g>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.14;.17;.97;1" begin="-6s" dur="12s" repeatCount="indefinite"/>
      <g transform="translate(24 72)">
        <rect x="17" y="2" width="50" height="50" rx="8" fill="#f7df1e"/>
        <text x="59" y="43" text-anchor="end" fill="#111827" font-family="Arial, sans-serif" font-size="25" font-weight="800">JS</text>
        <text x="83" y="29" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="750">JavaScript</text>
        <text x="83" y="48" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" letter-spacing="1.1">WEB · RUNTIME</text>
      </g>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.14;.17;.97;1" begin="-4s" dur="12s" repeatCount="indefinite"/>
      <g transform="translate(24 72)">
        <rect x="17" y="2" width="50" height="50" rx="8" fill="#3178c6"/>
        <text x="60" y="43" text-anchor="end" fill="#fff" font-family="Arial, sans-serif" font-size="25" font-weight="800">TS</text>
        <text x="83" y="29" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="750">TypeScript</text>
        <text x="83" y="48" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" letter-spacing="1.1">TYPED · FULL-STACK</text>
      </g>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.14;.17;.97;1" begin="-2s" dur="12s" repeatCount="indefinite"/>
      <g transform="translate(24 70)">
        <g transform="translate(17 0)">
          <path d="M25 0L12.5 22.5 25 30l12.5-7.5z" fill="#a5b4fc"/>
          <path d="M12.5 22.5L25 30V0z" fill="#c7d2fe"/>
          <path d="M25 33L12.5 25.5 25 54l12.5-28.5z" fill="#818cf8"/>
          <path d="M25 54V33l12.5-7.5z" fill="#6366f1"/>
        </g>
        <text x="83" y="31" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="750">Solidity</text>
        <text x="83" y="50" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" letter-spacing="1.1">WEB3 · CONTRACTS</text>
      </g>
    </g>

    <g transform="translate(25 161)">
      <rect width="190" height="3" rx="1.5" fill="#1e293b"/>
      <rect width="32" height="3" rx="1.5" fill="url(#edge)" filter="url(#smallGlow)">
        <animate attributeName="x" values="0;158;0" dur="4s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
